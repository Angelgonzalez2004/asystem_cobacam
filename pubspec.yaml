name: asystem_cobacam
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # --- ACTUALIZACIÓN CRÍTICA DE FIREBASE ---
  # Versiones estables para Android 14+ y Xiaomi
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  firebase_database: ^12.1.1
  firebase_storage: ^13.0.5
  # -----------------------------------------

  intl: ^0.20.2
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  gal: ^2.3.2
  mobile_scanner: ^7.1.4
  file_picker: ^10.3.8 
  excel: ^4.0.0 # Actualizado para compatibilidad
  provider: ^6.1.2
  animations: ^2.0.11
  shared_preferences: ^2.2.3
  
  # Hive
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  connectivity_plus: ^7.0.0 # Actualizado
  path_provider: ^2.1.3
  package_info_plus: ^9.0.0
  device_info_plus: ^12.3.0
  http: ^1.6.0
  barcode_widget: ^2.0.4
  image: ^4.3.0
  pdf: ^3.11.3
  google_generative_ai: ^0.4.7
  flutter_markdown_plus: ^1.0.7
  fl_chart: ^0.68.0
  cloud_functions: ^6.0.5
  archive: ^3.6.1
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  dropdown_search: ^5.0.6
  async: ^2.13.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.4
  build_runner: ^2.4.13
  hive_generator: ^2.0.1
  flutter_lints: ^6.0.0 # Ajustado a una versión más estándar por ahora
  analyzer: ^6.4.1 # Downgraded for compatibility with hive_generator
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo2.jpg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F5F5"
  image: assets/images/logo2.jpg
  android: true
  ios: true
  web: true
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: contain
  android_12:
    image: assets/images/logo2.jpg
    icon_background_color: "#F5F5F5"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/excel_templates/ # NEW: Excel templates for student import