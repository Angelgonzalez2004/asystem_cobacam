name: asystem_cobacam
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0' # Flutter 3.22.0 requiere Dart 3.4.0+

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  firebase_core: ^2.27.1
  firebase_auth: ^4.17.1
  firebase_database: ^10.5.2
  firebase_storage: ^11.7.1
  intl: ^0.19.0
  image_picker: ^1.1.2
  screenshot: ^3.0.0
  gal: ^2.3.2
  mobile_scanner: ^5.0.0
  
  # ACTUALIZADO: Esta versión corrige el error de compilación
  file_picker: ^8.0.0 
  
  excel: ^2.1.0 # Add excel for reading .xlsx files
  provider: ^6.1.2
  animations: ^2.0.11
  shared_preferences: ^2.2.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^5.0.2
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_native_splash: ^2.4.0
  build_runner: ^2.4.6 # Add for code generation
  hive_generator: ^2.0.1 # Add for Hive adapters

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo2.jpg"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#F5F5F5"
  image: assets/images/logo2.jpg
  android: true
  ios: true
  web: true

  # Platform-specific options to ensure the image is "contained" not "covered"
  android_gravity: center
  ios_content_mode: scaleAspectFit
  web_image_mode: contain
  
  android_12:
    image: assets/images/logo2.jpg
    icon_background_color: "#F5F5F5"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/