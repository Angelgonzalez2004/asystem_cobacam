  2. ¿Cuenta del Tutor o Cuenta del Alumno?


  Este es un punto de arquitectura crucial. Analicemos tus dos ideas:


   * Idea A (Tutor usa la cuenta del Alumno): Es tentador para no crear más cuentas, y técnicamente se podría notificar a todos los dispositivos que tengan esa cuenta
     abierta. PERO, no es nada recomendable por dos grandes problemas:
       1. Seguridad y Privacidad: Le estarías dando al tutor la contraseña y el acceso total a la cuenta del alumno. Podría ver todo lo que el alumno ve, y viceversa.
          Se rompe por completo la privacidad.
       2. Limita el Futuro: El sistema está basado en roles. Si el tutor inicia sesión como "Alumno", solo puede ver y hacer lo que un alumno puede. Si en el futuro
          quieres añadir una función para que los tutores vean estados de cuenta o se comuniquen con maestros, no podrías, porque estarían "atrapados" en la vista de
          Alumno.


   * Idea B (Tutor crea su propia cuenta - La Opción Correcta):
      Esta es la solución profesional y la que yo implementaría.
       1. Se crea un nuevo rol en el sistema: "Tutor".
       2. El padre, madre o tutor crea su propia cuenta con su propio correo y contraseña, seleccionando este nuevo rol.
       3. Una vez dentro, utiliza la función de "Vincular Alumno" que te mencioné en la explicación anterior para enlazar su cuenta con la matrícula de su hijo/a.


  Ventajas de Cuentas Separadas:
   * Seguridad: Cada quien tiene su propia contraseña.
   * Privacidad: La información de cada rol está separada.
   * Escalabilidad: Permite crear un panel de control exclusivo para tutores, donde en el futuro podrías mostrar información de varios hijos, avisos de pago, reportes
     de comportamiento, etc.


  Conclusión: Aunque requiere un paso extra para el tutor (crear una cuenta), la opción de cuentas separadas por rol es la única que garantiza un sistema seguro,
  privado y que pueda crecer a futuro. Es el estándar en la industria para este tipo de aplicaciones.