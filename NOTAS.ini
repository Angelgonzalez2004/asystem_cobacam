✦ ¡Excelentes preguntas! Esos son exactamente los detalles que definen un sistema robusto. Te respondo a ambos puntos:

  1. ¿Qué pasa si la Prefecta no tiene internet?


  Tu intuición es correcta, el modo offline que ya existe se encarga de esto. El proceso sería el siguiente:


   1. Sin Conexión: La Prefecta pasa lista. La app, al no poder contactar con la nube, guarda el registro de asistencia (ej: "Juan Pérez - Entrada - 07:05 a.m.") de
      forma segura en la memoria local de su propio dispositivo. En este momento, no se envía nada.
   2. Recupera Conexión: Más tarde, la Prefecta se mueve a un área con Wi-Fi o sus datos móviles se reactivan.
   3. Sincronización Automática: La aplicación detecta la conexión y automáticamente sube todos los registros que tenía guardados a la base de datos de Firebase.
   4. Se Dispara la Notificación: En el instante en que el registro de asistencia de Juan Pérez llega a la base de datos en la nube, la Cloud Function (el "robot") se
      activa y envía la notificación push al tutor.

  En resumen: La notificación llegará con un retraso (el tiempo que la Prefecta estuvo offline), pero nunca se perderá. La fiabilidad del sistema se mantiene.

